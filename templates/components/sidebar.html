  <div class="sidebar-inner slimscroll">
    <div id="sidebar-menu" class="sidebar-menu">
      <ul>
        <li class="submenu-open">

          <ul>
            <li class="{% if request.resolver_match.url_name == 'admin-dashboard' %}active{% endif %}">
              <a href="{%url 'admin-dashboard' %}" class="subdrop"><i
                  class="ti ti-layout-grid fs-16 me-2"></i>Dashboard</a>
            </li>
            <li
              class="{% if request.resolver_match.url_name == 'products' or request.resolver_match.url_name == 'addProduct' or request.resolver_match.url_name == 'editProduct' or request.resolver_match.url_name == 'productDetails' %}active{% endif %}">

            </li>


            <li

            <li

                <i class="ti ti-stack-3 fs-16 me-2"></i>Sales </a>
            </li>
            <li

            </li>
            <li class="{% if request.resolver_match.url_name == 'sales-report' %}active{% endif %}">

            </li>
            <li class="{% if request.resolver_match.url_name == 'manage-stocks' %}active{% endif %}">
              <a href="{%url 'manage-stocks' %}" class="subdrop">
                <i class="ti ti-stack-3 fs-16 me-2"></i></i>Manage Stock</a>
            </li>
            <li class="{% if request.resolver_match.url_name == 'profit-and-loss' %}active{% endif %}">

                <i class="ti ti-chart-donut fs-16 me-2"></i>Profit & Loss</a>
