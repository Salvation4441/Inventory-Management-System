{%extends './auth_base.html' %} 
{% load static %} 
  {% block content %}

<!-- Main Wrapper -->
<div class="main-wrapper">
  <div class="account-content">
    <div class="login-wrapper login-new">
      <div class="row w-100">
        <div class="col-lg-6 mx-auto">
          <div class="login-content user-login">
            <div class="login-logo">
              <img src="{%static 'assets/img/logo.svg'%}" alt="img" />
              <a href="" class="login-logo logo-white">
                <img src="{%static 'assets/img/logo-white.svg'%}" alt="Img" />
              </a>
            </div>
            <form action="">
              <div class="card col-lg-8 mx-auto">
                <div class="card-body p-5">
                  <div class="login-userheading">
                    <h3>Sign In</h3>
                    <h4>Login with email and password.</h4>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Email <span class="text-danger"> *</span></label>
                    <div class="input-group">
                      <input type="text" value="" class="form-control border-end-0" required />
                      <span class="input-group-text border-start-0">
                        <i class="ti ti-mail"></i>
                      </span>
                    </div>
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Password <span class="text-danger"> *</span></label>
                    <div class="pass-group">
                      <input type="password" class="pass-input form-control" required />
                      <span class="ti toggle-password ti-eye-off text-gray-9"></span>
                    </div>
                  </div>
                  <div class="form-login authentication-check">
                    <div class="row">
                      <div class="col-12 d-flex align-items-center justify-content-between">
                        <div class="custom-control custom-checkbox">
                          <label class="checkboxs ps-4 mb-0 pb-0 line-height-1 fs-16 text-gray-6">
                            <input type="checkbox" class="form-control" />
                            <span class="checkmarks"></span>Remember me
                          </label>
                        </div>
                        <div class="text-end">
                          <a class="text-orange fs-16 fw-medium" href="{%url 'forgotpassword' %}">Forgot Password?</a>
                        </div>
                      </div>
                    </div>
                  </div>
                  <div class="form-login">
                    <input type="submit" value="Sign In" class="btn btn-primary w-100"/>
                  </div>
                </div>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<!-- /Main Wrapper -->

{% endblock %}
