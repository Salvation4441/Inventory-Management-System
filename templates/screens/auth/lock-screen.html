{%extends './auth_base.html' %}
{% load static %}

{% block content %}

    <img src="{% static 'assets/img/bg/lock-screen-bg.png' %}" alt="bg" class="lock-screen-bg position-absolute img-fluid d-sm-none d-md-none d-lg-flex">

        <!-- Main Wrapper -->
		<div class="main-wrapper login-body">
			<div class="login-wrapper position-relative">
				<div class="container">
					<img class="img-fluid logo-dark mb-5" src="{% static 'assets/img/logo.svg' %}" alt="Logo">
					<div class="loginbox">
						<div class="login-right">
							<div class="login-right-wrap">
                                <div class="login-info">
                                    <p class="account-subtitle">Welcome back!</p>
                                    <img src="{% static 'assets/img/login-user.png' %}" class="img-fluid" alt="User-Img">
                                    <h5>John Smilga</h5>
                                </div>
                               
								<form action="#">
									<div class="input-blocks">
										<div class="pass-group">
											<input type="password" class="form-control pass-input" placeholder="Enter your password">
											<span class="fas toggle-password fa-eye-slash"></span>
										</div>
									</div>
									<button class="btn btn-lg btn-block btn-primary" type="submit">Log In</button>
								</form>
							</div>
						</div>
					</div>
                    
				</div>
			</div>
		</div>
		<!-- /Main Wrapper -->
    {%endblock%}
