{% extends './auth_base.html' %} 
{% load static %} 
{% block content %}
<!-- Main Wrapper -->
<div class="main-wrapper">
	<div class="account-content">
		<div class="login-wrapper login-new">
			<div class="row w-100">
				<div class="col-lg-4 col-md-6 col-sm-10 mx-auto">
					<div class="login-content user-login">
						<div class="login-logo mb-4 text-center">
							<img src="{% static 'assets/img/logo.svg' %}" alt="logo">
							<a href="{% url 'login' %}" class="login-logo logo-white">
								<img src="{% static 'assets/img/logo-white.svg' %}" alt="logo">
							</a>
						</div>
						<form action="{% url 'resetpassword' token=token %}" method="POST">
							{% csrf_token %}
							<div class="card shadow-sm border-0">
								<div class="card-body p-4 p-md-5">
									<div class="login-userheading mb-4 text-center">
										<h3 class="fw-bold mb-2">Reset Password</h3>
										<p class="text-muted" style="font-size: 13px;">Create a new secure password for <strong>{{ reset_user.username }}</strong>.</p>
									</div>

									<div class="mb-3">
										<label class="form-label fw-medium">New Password <span class="text-danger">*</span></label>
										<div class="pass-group position-relative">
											<input type="password" name="new_password" class="pass-input form-control" placeholder="Minimum 6 characters" required autofocus>
											<span class="ti toggle-password ti-eye-off text-muted position-absolute" style="right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer;"></span>
										</div>
									</div>

									<div class="mb-4">
										<label class="form-label fw-medium">Confirm New Password <span class="text-danger">*</span></label>
										<div class="pass-group position-relative">
											<input type="password" name="confirm_password" class="pass-inputs form-control" placeholder="Re-enter new password" required>
											<span class="ti toggle-passwords ti-eye-off text-muted position-absolute" style="right: 12px; top: 50%; transform: translateY(-50%); cursor: pointer;"></span>
										</div>
									</div>

									<div class="form-login mb-3">
										<button type="submit" class="btn btn-login w-100 fw-bold">
											<i class="ti ti-lock-check me-1"></i>Reset Password
										</button>
									</div>

									<div class="signinform text-center mt-3">
										<h4 class="mb-0" style="font-size: 14px;">Remember your password? <a href="{% url 'login' %}" class="hover-a text-primary fw-bold">Sign In</a></h4>
									</div>
								</div>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>
</div>
<!-- /Main Wrapper -->
{% endblock %}
