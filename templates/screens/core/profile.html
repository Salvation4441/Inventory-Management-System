{% extends 'base.html' %}
    {% block content %} 
     {% load static %}

     <div class="page-wrapper">
		<div class="content">
			<div class="page-header">
				<div class="page-title">
					<h4>Profile</h4>
					<h6>User Profile</h6>
				</div>
				<div class="page-btn mt-0">
					<a href="{%url 'admin-dashboard' %}" class="btn btn-secondary"><i data-feather="arrow-left" class="me-2"></i>Back to
					Dashboard</a>
				</div>
			</div>
			<!-- /product list -->
			<div class="card">
				<div class="card-header">
				<h4>Profile</h4>
				</div>
				<div class="card-body profile-body">
					<h5 class="mb-2"><i class="ti ti-user text-primary me-1"></i>Basic Information</h5>
						<div class="profile-pic-upload image-field">
							<div class="profile-pic p-2">
								<img src="{% static 'assets/img/users/user-49.png'  %}" class="object-fit-cover h-100 rounded-1" alt="user">
								<button type="button" class="close rounded-1">
									<span aria-hidden="true">&times;</span>
								</button>
							</div>
							<div class="mb-3">
								<div class="image-upload mb-0 d-inline-flex">
									<input type="file">
									<div class="btn btn-primary fs-13">Change Image</div>
								</div>
								<p class="mt-2">Upload an image below 2 MB, Accepted File format JPG, PNG</p>
							</div>
						</div>
					<form action="" method="POST">
						{% csrf_token %}
						<div class="row">
						<div class="col-lg-6 col-sm-12">
							<div class="mb-3">
								<label class="form-label">First Name<span class="text-danger ms-1">*</span></label>
								<input type="text" name="first_name" class="form-control" value="{{ user.first_name }}">
							</div>
						</div>
						<div class="col-lg-6 col-sm-12">
							<div class="mb-3">
								<label class="form-label">Last Name<span class="text-danger ms-1">*</span></label>
								<input type="text" name="last_name" class="form-control" value="{{ user.last_name }}">
							</div>
						</div>
						<div class="col-lg-6 col-sm-12">
							<div class="mb-3">
								<label>Email<span class="text-danger ms-1">*</span></label>
								<input type="email" name="email" class="form-control" disabled value="{{ user.email }}">
							</div>
						</div>
						<div class="col-lg-6 col-sm-12">
							<div class="mb-3">
								<label class="form-label">Phone Number<span class="text-danger ms-1">*</span></label>
								<input type="text" name="phone" class="form-control" value="{{ user.phone }}">
							</div>
						</div>
						<div class="col-lg-6 col-sm-12">
							<div class="mb-3">
								<label class="form-label">User Name<span class="text-danger ms-1">*</span></label>
								<input type="text" name="username" class="form-control" value="{{ user.username }}">
							</div>
						</div>
						<div class="col-12 d-flex justify-content-end">
							<button type="submit" class="btn btn-primary shadow-none">Save Changes</button>
						</div>
					</div>
					</form>
				</div>
			</div>
			<!-- /product list -->
		</div>

	 </div>

    {% endblock %}
