{% extends 'base.html' %} {% block content %} {% load static %}
<div class="page-wrapper">
  <div class="content modal-content">
    <div class="page-header">
      <div class="page-title">
        <h4>Add Sales</h4>
      </div>
      <div class="page-btn mt-0">
        <a href="{%url 'sales' %}" class="btn btn-secondary"
          ><i data-feather="arrow-left" class="me-2"> </i>Back to Sales
        </a>
      </div>
    </div>
    <form method="POST" action="{% url 'add-sales' %}" id="salesForm">
      {% csrf_token %}
      <div class="card border-0">
        <div class="card-body pb-0">
          <div class="row">
            <div class="col-lg-4 col-sm-6 col-12">
              <div class="mb-3 position-relative">
                <label class="form-label"> Customer Name </label>

                <div class="input-group">
                  <input
                    type="text"
                    id="customerSearch"
                    class="form-control"
                    name="customer_name"
                    value="Walk-in customer"
                    placeholder="Type customer name..."
                    autocomplete="off"
                  />
                  <input
                    type="text"
                    id="customerId"
                    hidden
                    class="form-control"
                    name="customer_id"
                    placeholder="Type customer name..."
                    autocomplete="off"
                  />
                </div>

                <!-- Custom dropdown results -->
                <div
                  id="customerNameAutocompleteResults"
                  class="border bg-white position-absolute w-100 shadow-sm rounded mt-1"
                  style="
                    z-index: 1000;
                    display: none;
                    max-height: 200px;
                    overflow-y: auto;
                  "
                ></div>
              </div>
            </div>
            <div class="col-lg-8 col-sm-6 col-12">
              <div class="row select-color-add">
                <div class="col-12">
                  <div class="mb-3 position-relative">
                    <label class="form-label">
                      Product <span class="text-danger ms-1">*</span>
                    </label>

                    <div class="input-group">
                      <input
                        type="text"
                        id="productSearch"
                        class="form-control"
                        placeholder="Type product name..."
                        autocomplete="off"
                      />

                      <button
                        type="button"
                        id="addProductBtn"
                        class="btn btn-dark"
                      >
                        <i data-feather="plus-circle"></i> Add
                      </button>
                    </div>

                    <!-- Custom dropdown results -->
                    <div
                      id="autocompleteResults"
                      class="border bg-white position-absolute w-100 shadow-sm rounded mt-1"
                      style="
                        z-index: 1000;
                        display: none;
                        max-height: 200px;
                        overflow-y: auto;
                      "
                    ></div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="col-lg-12 col-sm-6 col-12">
            <div
              id="SpacingTwo"
              class="accordion-collapse collapse show"
              aria-labelledby="headingSpacingTwo"
            >
              <div class="accordion-body px-0">
                <div class="tab-content" id="pills-tabContent">
                  <div
                    class="tab-pane fade show active"
                    id="pills-profile"
                    role="tabpanel"
                    aria-labelledby="pills-profile-tab"
                  >
                    <div class="modal-body-table border" id="variant-table">
                      <div class="table-responsive">
                        <table id="productTableBody" class="table border">
                          <thead>
                            <tr>
                              <th>Name</th>
                              <th>Unit Price</th>
                              <th>Selling Price</th>
                              <th>Subtotal</th>
                              <th>Quantity</th>
                              <th class="no-sort"></th>
                            </tr>
                          </thead>
                          <tbody></tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div class="row">
            <div class="col-lg-6 ms-auto">
              <div class="total-order w-100 max-widthauto m-auto mb-4">
                <ul class="border-1 rounded-2">
                  <li class="border-bottom">
                    <h4 class="border-end">Grand Total</h4>
                    <h5 id="grandTotal">GH 0.00</h5>
                  </li>
                </ul>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer p-4">
        <button
          type="button"
          class="btn btn-secondary add-cancel me-3"
          data-bs-dismiss="modal"
        >
          Cancel
        </button>
        <button type="submit" class="btn btn-primary add-sale" id="submitBtn">Submit</button>
      </div>
    </form>
  </div>
  <div
    class="footer d-sm-flex align-items-center justify-content-between border-top bg-white p-3"
  >
    <p class="mb-0">2014 - 2025 &copy; DreamsPOS. All Right Reserved</p>
    <p>
      Designed &amp; Developed by
      <a href="javascript:void(0);" class="text-primary">Dreams</a>
    </p>
  </div>
</div>
<script>
  document.addEventListener("DOMContentLoaded", function () {
  	{% if isSalesPerson %}
  	document.body.classList.add("menu-horizontal");
  	{% endif %}
  });
</script>

<script>
  // Define updateTotals in global scope so it can be called from handleSellingPrice
  function updateTotals() {
    let grandTotal = 0;

    document.querySelectorAll("#productTableBody tr").forEach((row) => {
      const qtyInput = row.querySelector("input[name='quantity[]']");
      if (!qtyInput) return;

      const qty = parseInt(qtyInput.value) || 1;
      const sellingPriceInput = row.querySelector(
        "input[name='selling_price[]']"
      );
      if (!sellingPriceInput) return;

      const sellingPrice = parseFloat(sellingPriceInput.value) || 0;
      const subtotal = qty * sellingPrice;
      row.querySelector(".subtotal").textContent = `GH${subtotal.toFixed(2)}`;
      grandTotal += subtotal;
    });
    document.querySelector("#grandTotal").textContent = `GH${grandTotal.toFixed(
      2
    )}`;
  }

  document.addEventListener("DOMContentLoaded", () => {
    const productSearch = document.querySelector("#productSearch");
    const customerSearch = document.querySelector("#customerSearch");
    const customerId = document.querySelector("#customerId");
    const resultsBox = document.querySelector("#autocompleteResults");
    const customerNameResultsBox = document.querySelector(
      "#customerNameAutocompleteResults"
    );
    const addBtn = document.querySelector("#addProductBtn");
    const tableBody = document.querySelector("#productTableBody"); // existing table
    let selectedProduct = null;
    let selectedCustomer = null;

    // Fetch matching products
    productSearch.addEventListener("input", async (e) => {
      const query = e.target.value.trim();
      if (!query) {
        resultsBox.style.display = "none";
        return;
      }

      const res = await fetch(`/search-products/?q=${query}`);
      const products = await res.json();

      if (!products.length) {
        resultsBox.innerHTML = `<div class="p-2 text-muted">No products found</div>`;
        resultsBox.style.display = "block";
        return;
      }

      resultsBox.innerHTML = products
        .map(
          (p) => `
						<div class="p-2 d-flex justify-content-between align-items-center hover-bg-light"
							style="cursor:pointer;"
							data-id="${p.id}" data-name="${p.name}" data-price="${p.price}" data-cost="${
            p.cost
          }">
							<span>${p.name}</span>
							<small class="text-muted">GH${p.price.toFixed(2)}</small>
						</div>
						`
        )
        .join("");
      resultsBox.style.display = "block";

      // Select a product
      resultsBox.addEventListener("click", (e) => {
        const item = e.target.closest("[data-id]");
        if (!item) return;

        selectedProduct = {
          id: item.dataset.id,
          name: item.dataset.name,
          price: parseFloat(item.dataset.price),
          cost: parseFloat(item.dataset.cost),
        };

        productSearch.value = selectedProduct.name;
        resultsBox.style.display = "none";
      });

      // Add product to the table
      addBtn.addEventListener("click", () => {
        if (!selectedProduct) {
          console.log("Please select a product first.");
          return;
        }

        // Check if already added
        if (document.querySelector(`tr[data-id='${selectedProduct.id}']`)) {
          console.log("Product already added.");
          return;
        }

        const row = document.createElement("tr");
        row.dataset.id = selectedProduct.id;
        row.innerHTML = `
					<td>
						<div class="add-product">
							<input type="text" class="form-control" value="${
                selectedProduct.name
              }" readonly />
							<input type="hidden" name="product_id[]" value="${selectedProduct.id}">
						</div>
					</td>
					<td>
						<div class="add-product">
							<input type="text" class="form-control" value="${selectedProduct.price.toFixed(
                2
              )}" readonly />
						</div>
					</td>
					<td>
						<div class="add-product">
							<input 
								type="text" 
								class="form-control selling-price-input" 
								name="selling_price[]" 
								onchange="handleSellingPrice(this, ${selectedProduct.price.toFixed(
                  2
                )}, ${selectedProduct.cost.toFixed(2)})"  
								value="${selectedProduct.price.toFixed(2)}" 
							/>
							<small class="form-text validation-message"></small>
						</div>
					</td>
					<td class="subtotal">
						GH${selectedProduct.price.toFixed(2)}
					</td>
					<td>
						<div class="product-quantity">
							<span class="quantity-btn minus-btn"><i data-feather="minus-circle" class="feather-search"></i></span>
							<input type="text" name="quantity[]" class="quntity-input form-control" value="1">
							<span class="quantity-btn plus-btn">+<i data-feather="plus-circle" class="plus-circle"></i></span>
						</div>
					</td>
					<td class="action-table-data">
						<div class="edit-delete-action">
						<a href="javascript:void(0);" class="p-2 removeBtn">
							<i data-feather="trash-2" class="feather-trash-2"></i>
						</a>
						</div>
					</td>
					`;

        tableBody.appendChild(row);
        updateTotals();
        selectedProduct = null;
        productSearch.value = "";
        feather.replace();

        row.querySelector(".plus-btn").addEventListener("click", () => {
          const input = row.querySelector(".quntity-input");
          input.value = parseInt(input.value || 0) + 1;
          updateTotals();
        });

        row.querySelector(".minus-btn").addEventListener("click", () => {
          const input = row.querySelector(".quntity-input");
          const newValue = Math.max(1, parseInt(input.value || 1) - 1);
          input.value = newValue;
          updateTotals();
        });

        row.querySelector(".removeBtn").addEventListener("click", () => {
          row.remove();
          updateTotals();
        });
      });
    });

    customerSearch.addEventListener("input", async (e) => {
      const query = e.target.value.trim();
      if (!query) {
        customerNameResultsBox.style.display = "none";
        return;
      }

      const res = await fetch(`/search-customers/?q=${query}`);
      const customers = await res.json();

      customerNameResultsBox.innerHTML = customers
        .map(
          (p) => `
			<div class="p-2 d-flex justify-content-between align-items-center hover-bg-light"
				style="cursor:pointer;"
				data-id="${p.id}" data-name="${p.name}">
				${p.name}
			</div>
			`
        )
        .join("");
      customerNameResultsBox.style.display = "block";

      // Select a customer
      customerNameResultsBox.addEventListener("click", (e) => {
        const item = e.target.closest("[data-id]");
        if (!item) return;
        selectedCustomer = {
          id: item.dataset.id,
          name: item.dataset.name,
        };
        customerSearch.value = selectedCustomer.name;
        customerId.value = selectedCustomer.id;
        customerNameResultsBox.style.display = "none";
      });
    });

    // Update subtotal on quantity change
    tableBody.addEventListener("input", (e) => {
      if (
        e.target.classList.contains("quntity-input") ||
        e.target.classList.contains("selling-price-input")
      ) {
        updateTotals();
      }
    });

    // Remove row
    tableBody.addEventListener("click", (e) => {
      if (e.target.classList.contains("removeBtn")) {
        e.target.closest("tr").remove();
        updateTotals();
      }
    });

    // Hide results when clicking outside
    document.addEventListener("click", (e) => {
      if (!resultsBox.contains(e.target) && e.target !== productSearch) {
        resultsBox.style.display = "none";
      }
    });
  });

  function handleSellingPrice(input, price, cost_price) {
    // Get the entered value
    const enteredValue = input.value.trim();

    // Get the validation message element
    const messageEl = input.parentElement.querySelector(".validation-message");

    // If empty, don't validate yet - wait for user to finish typing
    if (!enteredValue || enteredValue === "") {
      input.classList.remove(
        "border-danger",
        "border-success",
        "border-warning"
      );
      input.title = "";
      if (messageEl) {
        messageEl.textContent = "";
        messageEl.className = "form-text validation-message";
      }
      return;
    }

    // Convert to number
    const enteredPrice = parseFloat(enteredValue);

    // Check if it's a valid number
    if (isNaN(enteredPrice)) {
      input.classList.add("border-danger");
      input.classList.remove("border-success", "border-warning");
      input.title = "Invalid number";
      if (messageEl) {
        messageEl.textContent = "Invalid number";
        messageEl.className = "form-text validation-message text-danger";
      }
      return;
    }

    // Check if price is negative or zero
    if (enteredPrice <= 0) {
      input.value = price.toFixed(2);
      input.classList.remove(
        "border-danger",
        "border-success",
        "border-warning"
      );
      input.title = "";
      if (messageEl) {
        messageEl.textContent = "";
        messageEl.className = "form-text validation-message";
      }
      updateTotals();
      return;
    }

    // Check if price is below cost price - automatically revert
    if (enteredPrice < cost_price) {
      input.value = price.toFixed(2);
      input.classList.add("border-warning");
      input.classList.remove("border-danger", "border-success");
      input.title = `Minimum price: GH${cost_price.toFixed(2)} (cost price)`;
      if (messageEl) {
        messageEl.textContent = `Minimum price: GH${cost_price.toFixed(
          2
        )} (cost price)`;
        messageEl.className = "form-text validation-message text-warning";
      }
      updateTotals();
      return;
    }

    // Valid price - format and update
    input.value = enteredPrice.toFixed(2);
    input.classList.add("border-success");
    input.classList.remove("border-danger", "border-warning");
    input.title = "Valid price";
    if (messageEl) {
      messageEl.textContent = "✓ Valid price";
      messageEl.className = "form-text validation-message text-success";
    }
    updateTotals();
  }
</script>

{%endblock%}
