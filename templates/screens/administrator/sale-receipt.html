{% extends 'base.html' %} {% block content %} {% load static %}

<div class="page-wrapper" style="background: radial-gradient(circle at 50% 0%, rgba(254, 159, 67, 0.08) 0%, rgba(241, 245, 249, 0.95) 70%); min-height: 100vh;">
  <div class="content">
    
    <!-- Top Action Header -->
    <div class="page-header d-flex align-items-center justify-content-between flex-wrap gap-3 mb-4">
      <div class="page-title">
        <h4 class="fw-bold text-dark mb-1">A4 Transaction Invoice</h4>
        <h6 class="text-muted mb-0">Official Document for Sale <span class="badge bg-dark text-white font-mono">#{{ sale.reference }}</span></h6>
      </div>
      
      <div class="page-btn d-flex align-items-center gap-2 flex-wrap">
        <span class="text-muted fs-12 fw-bold text-uppercase me-1">UI/UX Layout:</span>
        <!-- Soft Capsule Pill Theme Switcher -->
        <button type="button" class="badge-soft-info pill-btn-info fs-12 py-1.5 px-3 border-0 cursor-pointer fw-bold" id="btnPageViewClassic" onclick="switchPageA4Theme('classic')" style="transform: scale(1.08);">
          <i class="ti ti-building me-1"></i>Classic A4
        </button>
        <button type="button" class="badge-soft-warning pill-btn-warning fs-12 py-1.5 px-3 border-0 cursor-pointer fw-bold" id="btnPageViewExecutive" onclick="switchPageA4Theme('executive')">
          <i class="ti ti-crown me-1"></i>Executive A4
        </button>
        <button type="button" class="badge-soft-primary pill-btn-primary fs-12 py-1.5 px-3 border-0 cursor-pointer fw-bold" id="btnPageViewRetail" onclick="switchPageA4Theme('retail')">
          <i class="ti ti-receipt-2 me-1"></i>Retail A4
        </button>

        <a href="{% url 'sales' %}" class="btn btn-secondary ms-2">
          <i class="ti ti-arrow-left me-1"></i>Back to Sales
        </a>
        <button onclick="window.print()" class="btn btn-primary fw-bold shadow-sm">
          <i class="ti ti-printer me-1"></i>Print A4
        </button>
        <a href="{% url 'add-sales' %}" class="btn btn-success fw-bold shadow-sm">
          <i class="ti ti-plus me-1"></i>New Sale
        </a>
      </div>
    </div>

    <!-- Paper Canvas Studio Container -->
    <div class="py-4 d-flex justify-content-center">
      {% include 'screens/administrator/receipt-content.html' %}
    </div>

  </div>
</div>

<script>
  function switchPageA4Theme(theme) {
    const themes = ['executive', 'classic', 'retail'];
    themes.forEach(t => {
      const el = document.getElementById('theme-' + t);
      if (el) el.classList.add('d-none');
    });

    const activeEl = document.getElementById('theme-' + theme);
    if (activeEl) activeEl.classList.remove('d-none');

    const btnExec = document.getElementById('btnPageViewExecutive');
    const btnClassic = document.getElementById('btnPageViewClassic');
    const btnRetail = document.getElementById('btnPageViewRetail');

    if (btnExec && btnClassic && btnRetail) {
      btnExec.style.transform = theme === 'executive' ? 'scale(1.08)' : 'scale(1)';
      btnClassic.style.transform = theme === 'classic' ? 'scale(1.08)' : 'scale(1)';
      btnRetail.style.transform = theme === 'retail' ? 'scale(1.08)' : 'scale(1)';
    }
  }
</script>

{% endblock %}
